spring.application.name=smart-procurement

# H2 / Database Configuration
spring.datasource.url=jdbc:h2:mem:smart_procurement;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# JWT Security Settings
jwt.secret=9a2f8c7e6d5b4a3f2e1d0c9b8a7f6e5d4c3b2a1f9e8d7c6b5a4f3e2d1c0b9a8f
jwt.expiration=86400000

# Google Maps Platform Configuration
google.maps.api.key=${GOOGLE_MAPS_API_KEY:}
google.maps.route.cache.seconds=${GOOGLE_ROUTE_CACHE_SECONDS:60}

# Server Port
server.port=8080


# SMS Provider Configuration (Twilio Integration)
sms.enabled=${SMS_ENABLED:true}
sms.provider=${SMS_PROVIDER:twilio}
twilio.account.sid=${TWILIO_ACCOUNT_SID}
twilio.auth.token=${TWILIO_AUTH_TOKEN}
twilio.from.number=${TWILIO_FROM_NUMBER}
sms.timeout.seconds=${SMS_TIMEOUT_SECONDS:10}

# Razorpay TEST MODE Configuration
razorpay.key.id=${RAZORPAY_KEY_ID}
razorpay.key.secret=${RAZORPAY_KEY_SECRET}
razorpay.currency=INR
razorpay.deposit.amount.paise=30000


