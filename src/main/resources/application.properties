spring.application.name=smart-procurement

# ─── Database Configuration ────────────────────────────────────────────────
# Production: set DB_URL, DB_USERNAME, DB_PASSWORD, DB_DRIVER, DB_DIALECT
# Local dev:  falls back to H2 in-memory (no setup required)
spring.datasource.url=${DB_URL:jdbc:h2:mem:smart_procurement;DB_CLOSE_DELAY=-1;MODE=MySQL}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

# H2 Console (local dev only — disable in production via H2_CONSOLE_ENABLED=false)
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:true}
spring.h2.console.path=/h2-console

# ─── JPA / Hibernate ───────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=${DB_DIALECT:org.hibernate.dialect.H2Dialect}
# Allow Hibernate to start even when DB is briefly unavailable
spring.jpa.properties.hibernate.connection.provider_disables_autocommit=false

# ─── JWT Security ──────────────────────────────────────────────────────────
# NEVER hardcode the real secret. Set JWT_SECRET env var in your cloud platform.
jwt.secret=${JWT_SECRET:local-dev-secret-replace-in-production}
jwt.expiration=86400000

# ─── Server ────────────────────────────────────────────────────────────────
server.port=${PORT:8080}

# ─── Google Maps ───────────────────────────────────────────────────────────
google.maps.api.key=${GOOGLE_MAPS_API_KEY:}
google.maps.route.cache.seconds=${GOOGLE_ROUTE_CACHE_SECONDS:60}

# ─── SMS / Twilio ──────────────────────────────────────────────────────────
sms.enabled=${SMS_ENABLED:false}
sms.provider=${SMS_PROVIDER:twilio}
twilio.account.sid=${TWILIO_ACCOUNT_SID:}
twilio.auth.token=${TWILIO_AUTH_TOKEN:}
twilio.from.number=${TWILIO_FROM_NUMBER:}
sms.timeout.seconds=${SMS_TIMEOUT_SECONDS:10}

# ─── Razorpay ──────────────────────────────────────────────────────────────
razorpay.key.id=${RAZORPAY_KEY_ID:}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:}
razorpay.currency=INR
razorpay.deposit.amount.paise=30000
