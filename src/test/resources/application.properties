spring.application.name=smart-procurement-test

# H2 Database Configuration for Tests
spring.datasource.url=jdbc:h2:mem:smart_procurement_test;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA Settings
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# JWT Security Settings
jwt.secret=9a2f8c7e6d5b4a3f2e1d0c9b8a7f6e5d4c3b2a1f9e8d7c6b5a4f3e2d1c0b9a8f
jwt.expiration=86400000

# Google Maps Platform Configuration for Tests
google.maps.api.key=
google.maps.route.cache.seconds=60

socketio.host=localhost
socketio.port=8086
